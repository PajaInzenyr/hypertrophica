<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hypertrophica</title>
  <!-- Zvolený motiv (světlý/tmavý) se nastaví ještě před vykreslením stránky,
       aby při načtení neproblikla špatná barva. Volbu ukládá js/theme.js. -->
  <script>
    try {
      var savedTheme = localStorage.getItem('hw.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css">
  <!-- PWA: manifest (název, ikony pro instalaci na plochu) a barva lišty prohlížeče = barva hlavičky (--surface) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)">
  <!-- type="module" = moderní JavaScript s import/export; spouští se až po načtení HTML -->
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-title" href="#/">
        <span class="app-name">Hypertrophica</span>
        <span class="app-subtitle" data-i18n="app.subtitle"></span>
      </a>
      <!-- Odkaz na trénink s počtem cviků; popisek a počet doplní app.js -->
      <a id="plan-link" class="header-button" href="#/trenink" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path d="M9 6h11M9 12h11M9 18h11"/>
          <circle cx="4.5" cy="6" r="1.2" fill="currentColor"/>
          <circle cx="4.5" cy="12" r="1.2" fill="currentColor"/>
          <circle cx="4.5" cy="18" r="1.2" fill="currentColor"/>
        </svg>
        <span id="plan-count" class="plan-count" aria-hidden="true"></span>
      </a>
      <!-- Přepínač motivu; ikonu a popisek doplní js/theme.js -->
      <button id="theme-toggle" class="header-button" type="button" hidden></button>
    </div>
  </header>

  <main>
    <!-- Hláška o načítání / chybě. Texty doplní app.js ze souboru i18n/cs.json. -->
    <p id="status" class="status" role="status">Načítám…</p>
    <noscript><p class="status">Hypertrophica potřebuje zapnutý JavaScript.</p></noscript>

    <!-- Pohled 1: seznam cviků s vyhledáváním a filtry -->
    <section id="list-view" class="list-layout" hidden>
      <div class="search">
        <label for="search-input" class="visually-hidden" data-i18n="search.label"></label>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="search.placeholder">
      </div>

      <!-- Klikací schéma svalů; SVG vloží js/bodymap.js ze souboru assets/body-map.svg -->
      <figure class="body-map">
        <div class="body-map-labels" aria-hidden="true">
          <span data-i18n="bodymap.front"></span>
          <span data-i18n="bodymap.back"></span>
        </div>
        <div id="body-map" class="body-map-figure"></div>
        <figcaption class="body-map-hint" data-i18n="bodymap.hint"></figcaption>
      </figure>

      <fieldset class="filters">
        <legend class="visually-hidden" data-i18n="filters.heading"></legend>

        <label class="filter">
          <span data-i18n="filters.muscle"></span>
          <select id="filter-muscle"></select>
        </label>

        <label class="filter">
          <span data-i18n="filters.role"></span>
          <select id="filter-role"></select>
        </label>

        <label class="filter">
          <span data-i18n="filters.type"></span>
          <select id="filter-type"></select>
        </label>

        <label class="filter">
          <span data-i18n="filters.equipment"></span>
          <select id="filter-equipment"></select>
        </label>

        <div class="filter-actions">
          <!-- aria-pressed = přepínací tlačítko (zapnuto/vypnuto); text doplní app.js -->
          <button id="filter-favorites" type="button" class="button-secondary button-toggle" aria-pressed="false"></button>
          <button id="filter-reset" type="button" class="button-secondary" data-i18n="filters.reset"></button>
        </div>
      </fieldset>

      <p id="result-count" class="result-count" aria-live="polite"></p>
      <ul id="exercise-list" class="exercise-list"></ul>

      <!-- Panel s oblíbenými cviky. Zobrazí se jen na širokém monitoru (vpravo od seznamu),
           na mobilu je skrytý – tam slouží tlačítko „Oblíbené“ ve filtrech. Obsah doplní app.js. -->
      <aside class="favorites-panel" aria-labelledby="favorites-heading">
        <h2 id="favorites-heading" class="favorites-heading" data-i18n="favorites.heading"></h2>
        <ul id="favorites-list" class="exercise-list favorites-list"></ul>
      </aside>
    </section>

    <!-- Pohled 2: detail jednoho cviku (otevře se přes adresu #/cvik/<id>) -->
    <article id="detail-view" class="detail" hidden></article>

    <!-- Pohled 3: trénink = seřazený seznam cviků (adresa #/trenink).
         Obsah seznamu a tlačítka doplní app.js. -->
    <section id="plan-view" class="plan" aria-labelledby="plan-title" hidden>
      <a class="back-link" href="#/" id="plan-back"></a>
      <!-- Přepínač tréninků v týdnu: 1–4 = jednotlivé tréninky, Týden = souhrn partií.
           Tlačítka doplní app.js; u sdíleného tréninku je přepínač skrytý. -->
      <nav id="plan-tabs" class="plan-tabs" data-i18n-aria-label="week.tabsLabel"></nav>
      <div class="plan-heading">
        <h1 id="plan-title" tabindex="-1"></h1>
        <!-- Zámek proti nechtěnému přesunutí/odebrání cviků během tréninku.
             Ikonu, popisek a stav (aria-pressed) doplní app.js. -->
        <button id="plan-lock" class="icon-button lock-button" type="button" aria-pressed="false" hidden></button>
      </div>
      <p id="plan-intro" class="plan-intro"></p>
      <!-- role="list": Safari jinak u seznamu bez odrážek nehlásí, že jde o seznam -->
      <ol id="plan-list" class="plan-list" role="list"></ol>
      <!-- Schéma svalů zapojených v tréninku (jen pro čtení); SVG vloží app.js.
           Pro čtečky obrazovky je stejná informace i textem v #plan-map-summary. -->
      <figure id="plan-map" class="body-map plan-map" hidden>
        <h2 id="plan-map-heading"></h2>
        <div class="body-map-labels" aria-hidden="true">
          <span data-i18n="bodymap.front"></span>
          <span data-i18n="bodymap.back"></span>
        </div>
        <div id="plan-map-figure" class="body-map-figure"></div>
        <!-- Texty legendy nastaví app.js (u tréninku primární/sekundární, u týdne zapojeno/nedostatečně) -->
        <ul class="legend" aria-hidden="true">
          <li id="plan-legend-primary"></li>
          <li id="plan-legend-secondary" class="legend-secondary"></li>
        </ul>
        <p id="plan-map-summary" class="visually-hidden"></p>
      </figure>
      <!-- Jen v pohledu Týden: vynechané a nedostatečně zapojené partie (doplní app.js) -->
      <div id="week-summary" class="week-summary" hidden></div>
      <div id="plan-actions" class="plan-actions"></div>
      <!-- Viditelné potvrzení akcí (např. „Odkaz zkopírován“) -->
      <p id="plan-feedback" class="plan-feedback" role="status"></p>
      <!-- Hlášení pro čtečky obrazovky (např. nová pozice cviku po posunu) -->
      <p id="plan-announcer" class="visually-hidden" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
